<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Lab 2.0</title>

<style>
body {
  background: #151515;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 25px;
}

.box {
  background: #252525;
  padding: 20px;
  border-radius: 15px;
  margin-top: 25px;
}

h2 { color: #55d68b; }
</style>
</head>

<body>

<h2>Android Camera Lab 2.0</h2>

<div class="box">
  <h3>Проверка камеры</h3>
  <p id="secure"></p>
  <p id="permission">Проверяем разрешение...</p>
  <p id="support"></p>
</div>

<script>
async function checkCamera() {

  document.getElementById("secure").textContent =
    "HTTPS: " + (location.protocol === "https:" ? "Да" : "Нет");

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {
    document.getElementById("support").textContent =
      "Доступ к камере не поддерживается";
    return;
  }

  document.getElementById("support").textContent =
    "API камеры доступен";

  try {
    const result =
      await navigator.permissions.query({name: "camera"});

    document.getElementById("permission").textContent =
      "Состояние разрешения: " + result.state;
